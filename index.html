<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼</title>
<meta name="theme-color" content="#f5f5f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃什麼">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%231a1a1a'/><text y='360' x='80' font-size='320'>🍜</text></svg>">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;今天吃什麼&quot;,&quot;short_name&quot;:&quot;吃什麼&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23f5f5f5&quot;,&quot;theme_color&quot;:&quot;%231a1a1a&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%231a1a1a'/><text y='360' x='80' font-size='320'>🍜</text></svg>&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1a1a'/><text y='.9em' font-size='72' x='12'>🍜</text></svg>">
<style>
:root{--bg:#f5f5f5;--paper:#fff;--ink:#1a1a1a;--muted:#666;--line:#dedede;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{min-height:100%;scrollbar-color:#aaa var(--bg);scrollbar-gutter:stable}
body{min-height:100vh;min-height:100dvh;font:16px/1.5 -apple-system,BlinkMacSystemFont,'Helvetica Neue','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
button,a,input,select{touch-action:manipulation}
button,a{ -webkit-user-drag:none}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.hdr{padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr>div:first-child{min-width:0}
.hdr-title{font-size:24px;line-height:1.3;font-weight:750;letter-spacing:-.02em}
.hdr-loc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.hdr-actions{display:flex;gap:6px;flex-shrink:0}
.edit-btn,.relocate-btn,.modal-close,.cat-picker-close{width:44px;height:44px;border-radius:12px;background:transparent;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.relocate-btn.loading svg{animation:spin .8s linear infinite}
.location-tools{margin:8px 20px 0}
.location-tools summary{display:list-item;width:fit-content;max-width:100%;min-height:44px;padding:10px 0;font-size:14px;color:var(--muted);cursor:pointer}
.location-tools[open]{padding-bottom:12px;border-bottom:1px solid var(--line)}
.location-tools label{display:block;font-size:14px;margin:8px 0}
.location-form,.add-row{display:flex;gap:8px}
.location-form input,.add-name{width:0;min-width:0;flex:1;border:1px solid #aaa;border-radius:10px;padding:12px;background:var(--paper);font-size:16px;caret-color:var(--ink)}
input::placeholder{color:var(--muted);opacity:1}
.location-message,.helper{font-size:13px;line-height:1.65;color:var(--muted);margin-top:8px}
.location-candidate{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;font-size:15px;overflow-wrap:anywhere}
.location-candidate span{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.slot-section{padding:8px 20px 12px}
.slot-wrap{display:flex;align-items:center;gap:10px}
.reel-box{flex:1;min-width:0;height:56px;background:var(--paper);border-radius:12px;overflow:hidden;position:relative;border:1px solid #bbb;cursor:pointer;touch-action:pan-x;user-select:none}
.reel-box::before,.reel-box::after{content:'';position:absolute;left:0;right:0;height:10px;z-index:1;pointer-events:none}
.reel-box::before{top:0;background:linear-gradient(var(--paper),transparent)}
.reel-box::after{bottom:0;background:linear-gradient(transparent,var(--paper))}
.reel-track{display:flex;flex-direction:column;width:100%}
.reel-item{width:100%;height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 12px}
.reel-cat{font-size:17px;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pull-btn{width:56px;height:56px;border-radius:12px;background:var(--ink);border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot-hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.filters{padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.filters>label:first-child{display:flex;align-items:center;gap:8px}
.filters select{min-height:44px;padding:8px;border:1px solid #bbb;border-radius:10px;background:var(--paper);max-width:100%}
.open-filter{display:flex;align-items:center;gap:7px;min-height:44px}
.open-filter input{width:20px;height:20px;accent-color:var(--ink)}
.divider{height:1px;background:var(--line);margin:0 20px}
.list-sec{padding:0 20px 32px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;min-height:48px;padding:10px 4px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:15px}
.tabs button[aria-pressed=true]{border-bottom-color:var(--ink);color:var(--ink);font-weight:650}
.decide-btn{width:100%;min-height:52px;padding:12px 16px;background:var(--ink);color:var(--paper);border:0;border-radius:12px;font-size:17px;font-weight:650}
#decideTools>.helper{text-align:center;font-size:13px;margin-top:8px}
.decision{padding:20px;background:var(--paper);border:1px solid var(--ink);border-radius:var(--radius);margin-bottom:12px}
.decision h2{font-size:28px;line-height:1.3;font-weight:750;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.decision p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6;overflow-wrap:anywhere}
.link-actions{display:flex;gap:8px;flex-wrap:wrap}
.decision .link-actions{margin-top:16px}
.map-link,.save-btn,.quiet-btn,.add-ok{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 12px;border:1px solid #bbb;border-radius:10px;background:var(--paper);color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.map-link{flex:1;white-space:nowrap}
.map-link:first-child,.add-ok{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.decision .map-link{min-height:48px;font-size:15px}
.save-btn{flex-shrink:0;font-size:13px;padding:8px 12px}
.save-btn[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.list-hdr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:22px 0 12px}
.list-hdr-txt{font-size:14px;color:var(--muted);line-height:1.6}
.list-count{font-size:14px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.place-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.pc-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.pc-name{background:none;border:0;text-align:left;flex:1;min-width:0;min-height:44px;font-size:17px;font-weight:650;line-height:1.45;overflow-wrap:anywhere}
.pc-name:hover{text-decoration:underline;text-underline-offset:4px}
.pc-meta{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.pc-walk{color:var(--ink);font-weight:550}
.pc-dist{font-variant-numeric:tabular-nums}
.pc-addr{font-size:14px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.pc-nav{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pc-nav.show{display:block}
.empty{display:flex;flex-direction:column;align-items:center;padding:32px 8px;gap:8px;color:var(--muted);font-size:14px;line-height:1.7;text-align:center}
.empty-title{font-size:17px;font-weight:600;color:var(--ink)}
.statusbar{font-size:13px;color:var(--muted);line-height:1.7;padding-top:12px;overflow-wrap:anywhere}
.skeleton{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);height:112px;margin-bottom:10px;overflow:hidden;position:relative}
.skeleton::after{content:'';position:absolute;inset:0;background:#000;animation:loading-pulse 1.4s ease-in-out infinite}
@keyframes loading-pulse{0%,100%{opacity:0}50%{opacity:.035}}
.loc-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;transition:opacity .3s}
.loc-overlay.out{opacity:0;pointer-events:none}
.loc-title{font-size:20px;font-weight:650}
.loc-sub{font-size:15px;color:var(--muted);text-align:center;line-height:1.7}
.loc-tag{font-size:14px;color:var(--muted);text-align:center}
.loc-tag.ok{color:var(--ink)}
.loc-tag.fail{color:#b42318}
.loc-ring{width:32px;height:32px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg,.cat-picker-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;align-items:flex-end;justify-content:center;padding-top:24px}
.cat-picker-bg{z-index:400}
.modal-bg.show,.cat-picker-bg.show{display:flex}
.modal,.cat-picker{background:var(--paper);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:85vh;max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;padding:20px 20px max(24px,env(safe-area-inset-bottom))}
.modal-hdr,.cat-picker-hdr{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.modal-title,.cat-picker-title{font-size:19px;font-weight:650}
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.cat-item{display:flex;align-items:center;justify-content:center;position:relative;min-height:96px;padding:12px 6px 44px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.cat-label{font-size:14px;font-weight:500;overflow-wrap:anywhere;text-align:center}
.cat-del{position:absolute;bottom:0;left:0;width:100%;height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:0 0 12px 12px;background:transparent;color:var(--muted)}
.cat-del:hover{background:#e5e5e5;color:var(--ink)}
.add-name{font-size:16px}
.add-ok{flex-shrink:0}
.cat-picker-list{display:flex;flex-direction:column;gap:4px}
.cat-picker-item{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;padding:12px;text-align:left;font-size:16px;border:1px solid transparent;border-radius:10px;background:transparent;overflow-wrap:anywhere}
.cat-picker-item.active{font-weight:650;background:var(--bg);border-color:var(--line)}
.cat-picker-item.active::after{content:'';width:8px;height:8px;flex-shrink:0;background:var(--ink);border-radius:50%}
@media(hover:hover){.edit-btn:hover,.relocate-btn:hover,.modal-close:hover,.cat-picker-close:hover,.cat-picker-item:hover{background:#e9e9e9}.decide-btn:hover,.pull-btn:hover,.map-link:first-child:hover,.add-ok:hover{background:#333}.quiet-btn:hover,.save-btn:hover{border-color:var(--ink)}}
@media(min-width:768px){.app{padding:16px 0 32px}.hdr{padding-top:24px}.list-sec{padding-bottom:32px}.modal-bg,.cat-picker-bg{align-items:center;padding:24px}.modal,.cat-picker{border-radius:20px}}
@media(max-width:359px){.hdr,.slot-section{padding-left:16px;padding-right:16px}.hdr-actions{gap:4px}.hdr-title{font-size:22px}.location-tools{margin-left:16px;margin-right:16px}.filters,.list-sec{padding-left:16px;padding-right:16px}.filters{font-size:13px}.filters>label:first-child{gap:4px}.filters select{padding:8px 4px}.open-filter{gap:5px}.location-form{flex-wrap:wrap}.location-form input{flex-basis:100%}.decision{padding:16px}.decision h2{font-size:25px}.map-link{flex-basis:100%}.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

<div class="loc-overlay" id="locOv">
  <div class="loc-title">取得位置中</div>
  <div class="loc-ring" id="locRing"></div>
  <div class="loc-sub">允許定位，或手動設定搜尋位置</div>
  <button class="quiet-btn" onclick="useManualLocation()">手動設定位置</button>
  <div class="loc-tag" id="locTag">請允許瀏覽器存取位置</div>
</div>

<div class="hdr">
  <div>
    <h1 class="hdr-title">今天吃什麼</h1>
    <div class="hdr-loc" id="hdrLoc">取得位置中</div>
  </div>
  <div class="hdr-actions">
    <button class="relocate-btn" id="relocateBtn" onclick="relocate()" title="重新定位">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      </svg>
    </button>
    <button class="edit-btn" onclick="openModal()" title="編輯分類">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
  </div>
</div>

<details class="location-tools" id="locationTools">
  <summary>手動設定搜尋位置</summary>
  <form id="locationForm" onsubmit="event.preventDefault(); findLocation()">
    <label for="locationQuery">輸入地址、地點或緯度,經度</label>
    <div class="location-form"><input id="locationQuery" type="search" maxlength="200" placeholder="例如：台北車站" required>
    <button class="add-ok" id="locationSearchBtn" type="submit">找位置</button></div>
  </form>
  <p class="location-message" id="locationMessage" role="status">選好位置後，會以該地點為中心搜尋。</p>
  <div id="locationResults"></div>
</details>
<div class="slot-section">
  <div class="slot-wrap">
    <div class="reel-box" id="reelBox" role="button" tabindex="0" aria-label="選擇餐飲分類" aria-haspopup="dialog">
      <div class="reel-track" id="reelTrack" aria-hidden="true"></div>
    </div>
    <button class="pull-btn" id="pullBtn" onclick="pull()" title="隨機">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="4"/>
    <circle cx="8" cy="8" r="1.2" fill="white" stroke="none"/>
    <circle cx="16" cy="8" r="1.2" fill="white" stroke="none"/>
    <circle cx="8" cy="16" r="1.2" fill="white" stroke="none"/>
    <circle cx="16" cy="16" r="1.2" fill="white" stroke="none"/>
    <circle cx="12" cy="12" r="1.2" fill="white" stroke="none"/>
  </svg>
</button>
  </div>
  <div class="slot-hint">滑動或點擊選分類，右側按鈕隨機抽選</div>
</div>

<div class="filters">
  <label for="walkRange">步行範圍 <select id="walkRange" onchange="changeRange(this.value)">
    <option value="5">約 5 分鐘</option><option value="10" selected>約 10 分鐘</option>
    <option value="15">約 15 分鐘</option><option value="20">約 20 分鐘</option>
  </select></label>
  <label class="open-filter"><input id="openOnly" type="checkbox" onchange="changeOpenOnly(this.checked)">只看營業中</label>
</div>
<div class="divider"></div>

<div class="list-sec">
  <nav class="tabs" aria-label="餐廳清單">
    <button id="tabNearby" aria-pressed="true" onclick="switchView('nearby')">附近</button>
    <button id="tabFavorites" aria-pressed="false" onclick="switchView('favorites')">收藏</button>
    <button id="tabHistory" aria-pressed="false" onclick="switchView('history')">最近選過</button>
  </nav>
  <div id="decideTools">
    <section class="decision" id="decisionPanel" aria-label="這次的選擇" aria-live="polite" hidden></section>
    <button class="decide-btn" id="decideBtn" onclick="decideRestaurant()">幫我決定一家</button>
    <p class="helper">從目前分類抽一家，優先避開最近選過的店。</p>
  </div>
  <div class="list-hdr">
    <span class="list-hdr-txt" id="listLabel">選擇類別</span>
    <span class="list-count" id="listCount"></span>
  </div>
  <div id="placeList">
    <div class="empty">
      <div class="empty-title">選擇分類，或讓我幫你決定</div>
      <div>選定分類後自動搜尋附近店家</div>
    </div>
  </div>
  <div class="statusbar" id="statusBar" role="status"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle" tabindex="-1">
    <div class="modal-hdr">
      <h2 class="modal-title" id="editTitle">編輯分類</h2>
      <button class="modal-close" onclick="closeModal()" aria-label="關閉分類編輯"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="add-row">
      <input class="add-name" id="newName" aria-label="新增分類名稱" placeholder="新增分類名稱..."/>
      <button class="add-ok" onclick="addCat()">新增</button>
    </div>
  </div>
</div>

<div class="cat-picker-bg" id="catPickerBg">
  <div class="cat-picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" tabindex="-1">
    <div class="cat-picker-hdr">
      <h2 class="cat-picker-title" id="pickerTitle">選擇類別</h2>
      <button class="cat-picker-close" onclick="closeCatPicker()" aria-label="關閉分類選單"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="cat-picker-list" id="catPickerList"></div>
  </div>
</div>

<script>
const WALK_MPS = 80;
let walkMin = 10;
let openOnly = false;
let activeView = 'nearby';
let nearbyPlaces = [];
let resultsReady = false;
let searching = false;
let pickedPlace = null;
let favorites = readStoredPlaces('food_favorites');
let history = readStoredPlaces('food_history');
let pulling = false;
let selectedCat = null;
let userLat = null, userLng = null;
let openNavIdx = null;

// ── 分類持久化 ──
const CAT_KEY = 'food_cats';

function saveCategories() {
  try {
    localStorage.setItem(CAT_KEY, JSON.stringify(categories.map(c => c.name)));
  } catch(e) {}
}

function loadSavedNames() {
  try {
    const raw = localStorage.getItem(CAT_KEY);
    const names = raw ? JSON.parse(raw) : null;
    return Array.isArray(names) && names.length >= 3 && names.every(name => typeof name === 'string' && name.trim()) ? names : null;
  } catch(e) { return null; }
}

const DEFAULT_CAT_NAMES = ['日式料理','泰式料理','越式料理','炒飯炒麵','牛肉麵','便當','西式料理','咖啡廳','火鍋','台式小吃','拉麵','鍋貼水餃','豆漿店'];
const savedNames = loadSavedNames();
let categories = (savedNames || DEFAULT_CAT_NAMES).map(name => ({ name }));

// ── 滾輪 ──
const ITEM_H = 56;
let currentIdx = 0;  // 目前停在哪個分類

function buildReel() {
  const track = document.getElementById('reelTrack');
  const fragment = document.createDocumentFragment();
  // 3 份確保循環
  for (let r = 0; r < 3; r++) {
    categories.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'reel-item';
      const label = document.createElement('div');
      label.className = 'reel-cat';
      label.textContent = cat.name;
      div.appendChild(label);
      fragment.appendChild(div);
    });
  }
  track.replaceChildren(fragment);
  snapTo(currentIdx, false);
}
buildReel();

function centerAdj() { return 0; }

// 跳到指定 index（第二份，避免邊界）
function snapTo(idx, animate) {
  currentIdx = ((idx % categories.length) + categories.length) % categories.length;
  document.getElementById('reelBox').setAttribute('aria-label', `選擇餐飲分類，目前為${categories[currentIdx].name}`);
  const track = document.getElementById('reelTrack');
  const targetY = -(categories.length * ITEM_H + currentIdx * ITEM_H) + centerAdj();
  track.style.transition = animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches
    ? 'transform 300ms cubic-bezier(0.25,0.8,0.25,1)' : 'none';
  track.style.transform = `translateY(${targetY}px)`;
}

// ── 觸控滑動 ──
(function setupDrag() {
  const box = document.getElementById('reelBox');
  let startY = 0, startIdx = 0, dragging = false, lastY = 0, vel = 0, lastTime = 0;
  let moved = false;

  const getY = e => e.touches ? e.touches[0].clientY : e.clientY;

  box.addEventListener('touchstart', e => {
    if (pulling) return;
    startY = getY(e); lastY = startY; startIdx = currentIdx;
    dragging = true; vel = 0; lastTime = Date.now(); moved = false;
    document.getElementById('reelTrack').style.transition = 'none';
  }, { passive: true });

  box.addEventListener('touchmove', e => {
    if (!dragging) return;
    const y = getY(e);
    const now = Date.now();
    vel = (y - lastY) / Math.max(1, now - lastTime);
    lastY = y; lastTime = now;
    if (Math.abs(y - startY) > 6) moved = true;
    const delta = startY - y;
    const rawIdx = startIdx + delta / ITEM_H;
    const track = document.getElementById('reelTrack');
    const n = categories.length;
    const boundedIdx = Math.max(0, Math.min(n - 1, rawIdx));
    const targetY = -(n * ITEM_H + boundedIdx * ITEM_H) + centerAdj();
    track.style.transform = `translateY(${targetY}px)`;
  }, { passive: true });

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (!moved) {
      // 判定為點擊 → 開啟選擇器
      openCatPicker();
      return;
    }
    const momentum = -vel * 80;
    const delta = (startY - lastY) / ITEM_H + momentum / ITEM_H;
    const target = Math.round(startIdx + delta);
    const n = categories.length;
    snapTo(Math.max(0, Math.min(n - 1, target)), true);
    // 滑動後自動搜尋
    if (!pulling && userLat !== null) {
      scheduleSearch();
    }
  };

  box.addEventListener('touchend', endDrag, { passive: true });
  box.addEventListener('touchcancel', endDrag, { passive: true });

  // 滑鼠支援（桌面測試用）
  box.addEventListener('mousedown', e => {
    if (pulling) return;
    startY = getY(e); lastY = startY; startIdx = currentIdx;
    dragging = true; vel = 0; lastTime = Date.now(); moved = false;
    document.getElementById('reelTrack').style.transition = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const y = getY(e);
    const now = Date.now();
    vel = (y - lastY) / Math.max(1, now - lastTime);
    lastY = y; lastTime = now;
    if (Math.abs(y - startY) > 6) moved = true;
    const delta = startY - y;
    const n = categories.length;
    const rawIdx = Math.max(0, Math.min(n - 1, startIdx + delta / ITEM_H));
    const track = document.getElementById('reelTrack');
    const targetY = -(n * ITEM_H + rawIdx * ITEM_H) + centerAdj();
    track.style.transform = `translateY(${targetY}px)`;
  });
  window.addEventListener('mouseup', endDrag);

})();

function pull() {

  cancelSearch();
  activeView = 'nearby';

  track.style.transition = 'none';
  track.style.transform = `translateY(${-(n * ITEM_H + currentIdx * ITEM_H) + centerAdj()}px)`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 2200 + Math.random() * 600;
    track.style.transition = `transform ${duration}ms cubic-bezier(0.15,0.85,0.3,1.0)`;

    setTimeout(() => {

let locationVersion = 0;

function validCoords(lat, lng) {

  document.getElementById('hdrLoc').textContent = label;

}
function getLocation() {

  if (cached && validCoords(cached.lat, cached.lng) && Number.isFinite(cached.ts) && Date.now() - cached.ts < 30 * 60 * 1000) {
    setSearchLocation(cached.lat, cached.lng, cached.label || `${cached.lat.toFixed(4)}, ${cached.lng.toFixed(4)}`, cached.manual, cached.demo, false);
    if (cached.manual || cached.demo) return;
  }

}
function relocate(initial = false) {
  locationController?.abort();
  const version = ++locationVersion;
  const btn = document.getElementById('relocateBtn');
  btn.classList.add('loading'); btn.disabled = true;
  document.getElementById('locationSearchBtn').disabled = false;
  const finish = () => { btn.classList.remove('loading'); btn.disabled = false; };
  const fail = () => {
    if (version !== locationVersion) return;
    finish(); hideLocationOverlay();
    if (userLat === null) setSearchLocation(25.0478, 121.5170, '台北車站附近（示範）', false, true);
    document.getElementById('locationTools').open = true;
    document.getElementById('locationMessage').textContent = '無法取得定位，可輸入地址或地點。' + (initial ? ' 目前可使用示範位置。' : ' 保留原搜尋位置。');
  };
  if (!navigator.geolocation) { fail(); return; }
  navigator.geolocation.getCurrentPosition(p => {
    if (version !== locationVersion) return;
    finish();
    setSearchLocation(p.coords.latitude, p.coords.longitude, `${p.coords.latitude.toFixed(4)}, ${p.coords.longitude.toFixed(4)}`);
    document.getElementById('locationMessage').textContent = '已使用裝置目前位置。';
  }, fail, { enableHighAccuracy: true, timeout: 10000 });
}
async function findLocation() {
  const query = document.getElementById('locationQuery').value.trim();
  if (!query) return;
  const version = ++locationVersion;
  locationController?.abort();
  const controller = locationController = new AbortController();
  const btn = document.getElementById('locationSearchBtn');
  document.getElementById('relocateBtn').disabled = false;
  document.getElementById('relocateBtn').classList.remove('loading');
  btn.disabled = true;
  locationCandidates = [];
  document.getElementById('locationResults').innerHTML = '';
  document.getElementById('locationMessage').textContent = '搜尋地點中…';
  try {
    const parts = query.split(/[,，]/).map(part => part.trim());
    if (parts.length === 2 && parts.every(part => part !== '' && Number.isFinite(Number(part)))) {
      const [lat, lng] = parts.map(Number);
      if (!validCoords(lat, lng)) throw new Error('座標超出範圍，請輸入有效的緯度,經度');
      setSearchLocation(lat, lng, `${lat.toFixed(4)}, ${lng.toFixed(4)}（手動）`, true);
      document.getElementById('locationMessage').textContent = '已更新搜尋位置。';
      return;
    }
    const resp = await fetch('/.netlify/functions/places?' + new URLSearchParams({ action: 'location', query }), { signal: controller.signal });
    const data = await resp.json();
    if (version !== locationVersion) return;
    if (!resp.ok || !['OK', 'ZERO_RESULTS'].includes(data.status)) throw new Error(data.error || data.error_message || '地點搜尋暫時無法使用');
    locationCandidates = (data.results || []).filter(p => validCoords(p.geometry?.location?.lat, p.geometry?.location?.lng)).slice(0, 5);
    document.getElementById('locationResults').innerHTML = locationCandidates.map((p, i) => `<button class="location-candidate" onclick="chooseLocation(${i})">${escapeHTML(p.name)}<span>${escapeHTML(p.formatted_address || '')}</span></button>`).join('');
    document.getElementById('locationMessage').textContent = locationCandidates.length ? '選擇要使用的搜尋中心：' : '找不到地點，請補上縣市或完整地址。';
  } catch(e) {
    if (version !== locationVersion || e.name === 'AbortError') return;
    document.getElementById('locationMessage').textContent = e.message;
  } finally {
    if (version === locationVersion) btn.disabled = false;
  }
}
function chooseLocation(i) {
  const p = locationCandidates[i];
  if (!p) return;
  const { lat, lng } = p.geometry.location;
  setSearchLocation(lat, lng, `${p.name}（手動）`, true);
  document.getElementById('locationResults').innerHTML = '';
  document.getElementById('locationMessage').textContent = `已使用 ${p.name} 作為搜尋中心。`;
  document.getElementById('locationTools').open = false;
}

function haversine(a, b, c, d) {
  const R = 6371000, dL = (c-a)*Math.PI/180, dN = (d-b)*Math.PI/180;
  const x = Math.sin(dL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dN/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
function setStatus(t) { document.getElementById('statusBar').textContent = t; }

// 每個分類對應的 Google Places 搜尋關鍵字
const CAT_GOOGLE = {
  '日式料理': { kw:'japanese restaurant', type:'restaurant' },
  '泰式料理': { kw:'thai restaurant',     type:'restaurant' },
  '越式料理': { kw:'vietnamese restaurant',type:'restaurant' },
  '炒飯炒麵': { kw:'炒飯 炒麵',           type:'restaurant' },
  '牛肉麵':   { kw:'牛肉麵',              type:'restaurant' },
  '便當':     { kw:'便當',               type:'restaurant' },
  '西式料理': { kw:'western restaurant',  type:'restaurant' },
  '咖啡廳':   { kw:'',                   type:'cafe' },
  '火鍋':     { kw:'火鍋',               type:'restaurant' },
  '台式小吃': { kw:'台式小吃',            type:'restaurant' },
  '拉麵':     { kw:'拉麵',               type:'restaurant' },
  '鍋貼水餃': { kw:'鍋貼 水餃',           type:'restaurant' },
  '豆漿店':   { kw:'豆漿 早餐',           type:'restaurant' },
};

let searchTimer;
let searchController;
let searchVersion = 0;

function cancelSearch() {
  clearTimeout(searchTimer);
  searchController?.abort();
  searchVersion++;
  searching = false;
  document.getElementById('placeList').setAttribute('aria-busy', 'false');
  updateDecideButton();
}

function scheduleSearch() {
  cancelSearch();
  nearbyPlaces = []; resultsReady = false; pickedPlace = null;
  selectedCat = categories[currentIdx];
  activeView = 'nearby';
  updateViewControls();
  searchTimer = setTimeout(() => {
    selectedCat = categories[currentIdx];
    searchNearby();
  }, 320);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

async function searchNearby() {
  if (!selectedCat || userLat === null || activeView !== 'nearby') return;
  cancelSearch();
  const version = searchVersion;
  searching = true; resultsReady = false; nearbyPlaces = []; pickedPlace = null;
  updateViewControls();
  const controller = searchController = new AbortController();
  const latOrigin = userLat, lngOrigin = userLng;
  const list = document.getElementById('placeList');
  list.setAttribute('aria-busy', 'true');
  const radius = walkMin * WALK_MPS;
  document.getElementById('listLabel').textContent = `${selectedCat.name} · 約 ${walkMin} 分鐘步行範圍`;
  document.getElementById('listCount').textContent = '';
  document.getElementById('placeList').innerHTML = [1,2,3].map(() => `<div class="skeleton">
  <div style="padding:16px;display:flex;flex-direction:column;gap:8px">
    <div style="height:14px;width:55%;background:#f0f0f0;border-radius:6px"></div>
    <div style="height:11px;width:35%;background:#f5f5f5;border-radius:6px"></div>
    <div style="height:11px;width:70%;background:#f5f5f5;border-radius:6px"></div>
  </div>
</div>`).join('');
  setStatus('搜尋中');

  const catInfo = CAT_GOOGLE[selectedCat.name] || { kw: selectedCat.name, type: 'restaurant' };
  const params = new URLSearchParams({
    location: `${latOrigin},${lngOrigin}`,
    radius,
    type: catInfo.type,
  });
  if (catInfo.kw) params.set('keyword', catInfo.kw);

  const url = `/.netlify/functions/places?${params}`;

  try {
    const resp = await fetch(url, { signal: controller.signal });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    if (version !== searchVersion) return;
    if (data.status !== 'OK' && data.status !== 'ZERO_RESULTS') {
      throw new Error(data.error_message || data.error || data.status || '搜尋服務暫時無法使用');
    }

    const results = (data.results || []).map(p => {
      const lat = p.geometry.location.lat;
      const lng = p.geometry.location.lng;
      return {
        name: p.name,
        lat, lng,
        dist: Math.round(haversine(latOrigin, lngOrigin, lat, lng)),
        rating: p.rating,
        ratingCount: p.user_ratings_total,
        addr: p.vicinity || '',
        opening: p.opening_hours?.open_now != null
          ? (p.opening_hours.open_now ? '營業中' : '休息中')
          : '',
        isOpen: p.opening_hours?.open_now,
        priceLevel: p.price_level,
        placeId: p.place_id,
      };
    }).sort((a, b) => a.dist - b.dist);

    nearbyPlaces = results.filter(p => p.dist <= radius);
    resultsReady = true;
    if (activeView === 'nearby') showNearbyResults();
  } catch(e) {
    if (version !== searchVersion || e.name === 'AbortError') return;
    console.error(e);
    if (activeView !== 'nearby') return;
    setStatus('搜尋失敗：' + e.message);
    document.getElementById('placeList').innerHTML = '<div class="empty"><div class="empty-title">搜尋失敗</div><div style="font-size:12px;color:#666">請確認網路連線後重試</div></div>';
  } finally {
    if (version === searchVersion) {
      searching = false;
      list.setAttribute('aria-busy', 'false');
      updateDecideButton();
    }
  }
}


// ── 篩選、抽選與個人清單 ──
let _placeCache = [];
function placeKey(p) { return p.placeId || `${p.name}|${p.lat},${p.lng}`; }

}

function eligiblePlaces() { return nearbyPlaces.filter(p => !openOnly || p.isOpen === true); }
function showNearbyResults() {

  setStatus('僅儲存在此裝置 · 收藏與紀錄不套用附近篩選 · 營業資訊請開啟地圖確認');
}
async function decideRestaurant() {
  if (searching || pulling) return;
  if (userLat === null) { useManualLocation(); return; }
  activeView = 'nearby'; updateViewControls();
  if (!resultsReady) {
    selectedCat = selectedCat || categories[currentIdx];
    const pending = searchNearby();
    const version = searchVersion;
    await pending;
    if (version !== searchVersion) return;
  }
  if (!resultsReady || activeView !== 'nearby') return;
  const rows = eligiblePlaces();
  if (!rows.length) { setStatus('沒有符合條件的店家，請放寬步行範圍或營業篩選。'); return; }
  const recent = new Set(history.slice(0, 5).map(placeKey));
  let pool = rows.filter(p => !recent.has(placeKey(p)));
  if (!pool.length) pool = rows.filter(p => !pickedPlace || placeKey(p) !== placeKey(pickedPlace));
  if (!pool.length) pool = rows;
  pickedPlace = pool[Math.floor(Math.random() * pool.length)];
  const entry = storedPlace(pickedPlace);
  history = [entry, ...history.filter(p => placeKey(p) !== placeKey(entry))].slice(0, 20);
  savePersonalPlaces('food_history', history);
  const panel = document.getElementById('decisionPanel');
  panel.hidden = false;
  panel.innerHTML = `<h2>${escapeHTML(pickedPlace.name)}</h2><p>這次的選擇 · 約 ${Math.max(1, Math.round(pickedPlace.dist / WALK_MPS))} 分鐘步行 · ${rows.length === 1 ? '目前只有一家符合條件' : '不喜歡可以再換一家'}</p>${pickedPlace.addr ? `<p>${escapeHTML(pickedPlace.addr)}</p>` : ''}<div class="link-actions">${mapLinks(pickedPlace)}</div>`;
  updateDecideButton();
}
function toggleFavorite(i) {
  const p = _placeCache[i];
  if (!p) return;
  const key = placeKey(p), exists = favorites.some(row => placeKey(row) === key);
  if (exists) favorites = favorites.filter(row => placeKey(row) !== key);
  else {
    if (favorites.length >= 100) { setStatus('最多收藏 100 間，請先移除不需要的店家。'); return; }
    favorites.unshift(storedPlace(p));
  }
  if (activeView === 'nearby') showNearbyResults(); else showSavedView();
  savePersonalPlaces('food_favorites', favorites);
}
function mapsURL(p, directions = false) {
  const params = new URLSearchParams({ api: '1' });
  if (directions) {
    params.set('destination', `${p.lat},${p.lng}`);
    if (p.placeId) params.set('destination_place_id', p.placeId);
    params.set('travelmode', 'walking');
    if (userLat !== null) params.set('origin', `${userLat},${userLng}`);
  } else {
    params.set('query', p.name + (p.addr ? ' ' + p.addr : ''));
    if (p.placeId) params.set('query_place_id', p.placeId);
  }
  return `https://www.google.com/maps/${directions ? 'dir/' : 'search/'}?${params}`;
}
function mapLinks(p) {
  return `<a class="map-link" href="${escapeHTML(mapsURL(p, true))}" target="_blank" rel="noopener noreferrer">步行導航</a><a class="map-link" href="${escapeHTML(mapsURL(p))}" target="_blank" rel="noopener noreferrer">店家資訊</a>`;
}
function renderPlaces(list) {
  _placeCache = list; openNavIdx = null;
  if (!list.length) {
    const title = activeView === 'favorites' ? '還沒有收藏' : activeView === 'history' ? '還沒有抽選紀錄' : '找不到符合條件的店家';
    const hint = activeView === 'favorites' ? '搜尋店家後，按「收藏」即可保留。' : activeView === 'history' ? '按「幫我決定一家」，這裡就會留下紀錄。' : '試試增加步行時間、關閉營業篩選或選擇其他分類。';
    document.getElementById('placeList').innerHTML = `<div class="empty"><div class="empty-title">${title}</div><div>${hint}</div></div>`;
    return;
  }
  const priceMap = ['免費', '$', '$$', '$$$', '$$$$'];
  document.getElementById('placeList').innerHTML = list.map((p, i) => {
    const saved = favorites.some(row => placeKey(row) === placeKey(p));
    const opening = p.isOpen === true ? '營業中' : p.isOpen === false ? '休息中' : '營業狀態不明';
    return `<article class="place-card">
      <div class="pc-top"><button class="pc-name" id="placeToggle${i}" onclick="toggleNav(${i})" aria-expanded="false" aria-controls="pnav${i}">${escapeHTML(p.name)}</button>
      <button class="save-btn" aria-label="${saved ? '取消收藏' : '收藏'} ${escapeHTML(p.name)}" aria-pressed="${saved}" onclick="toggleFavorite(${i})">${saved ? '已收藏' : '收藏'}</button></div>
      <div class="pc-meta">
        ${p.dist != null ? `<span class="pc-walk">約 ${Math.max(1, Math.round(p.dist / WALK_MPS))} 分鐘步行</span><span class="pc-dist">${p.dist} m</span>` : ''}
        ${p.rating ? `<span>評分 ${escapeHTML(p.rating)} (${escapeHTML(p.ratingCount || 0)})</span>` : ''}
        ${p.priceLevel != null ? `<span>${priceMap[p.priceLevel] || '價位不明'}</span>` : ''}
        <span>${opening}</span>
      </div>
      ${p.addr ? `<div class="pc-addr">${escapeHTML(p.addr)}</div>` : ''}
      ${activeView === 'history' ? `<p class="helper">選於 ${escapeHTML(new Date(p.chosenAt).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }))}</p>` : ''}
      <div class="pc-nav" id="pnav${i}"><div class="link-actions">${mapLinks(p)}</div></div>
    </article>`;
  }).join('');
}
function toggleNav(i) {
  const nav = document.getElementById('pnav' + i);
  if (!nav) return;
  if (openNavIdx !== null && openNavIdx !== i) {
    document.getElementById('pnav' + openNavIdx)?.classList.remove('show');
    document.getElementById('placeToggle' + openNavIdx)?.setAttribute('aria-expanded', 'false');
  }
  const isOpen = nav.classList.contains('show');
  nav.classList.toggle('show', !isOpen);
  document.getElementById('placeToggle' + i).setAttribute('aria-expanded', String(!isOpen));
  openNavIdx = isOpen ? null : i;
}
document.getElementById('reelBox').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCatPicker(); }
});
updateViewControls();

// ── 分類視窗的鍵盤與焦點 ──
const sheetReturnFocus = new Map();
function openSheet(id) {
  sheetReturnFocus.set(id, document.activeElement);
  const bg = document.getElementById(id);
  bg.classList.add('show');
  document.body.style.overflow = 'hidden';
  bg.querySelector('[role="dialog"]')?.focus();
}
function closeSheet(id) {
  document.getElementById(id).classList.remove('show');
  if (!document.querySelector('.modal-bg.show,.cat-picker-bg.show')) document.body.style.overflow = '';
  sheetReturnFocus.get(id)?.focus();
  sheetReturnFocus.delete(id);
}
window.addEventListener('keydown', e => {
  const bg = document.querySelector('.cat-picker-bg.show,.modal-bg.show');
  if (!bg) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    if (bg.id === 'modalBg') closeModal(); else closeCatPicker();
  } else if (e.key === 'Tab') {
    const controls = Array.from(bg.querySelectorAll('button:not(:disabled),input:not(:disabled),[tabindex="0"]'));
    if (!controls.length) return;
    const first = controls[0], last = controls[controls.length - 1];
    if (e.shiftKey && (document.activeElement === first || !controls.includes(document.activeElement))) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && (document.activeElement === last || !controls.includes(document.activeElement))) {
      e.preventDefault(); first.focus();
    }
  }
});

// ── 編輯 ──
function openModal() { renderCatGrid(); openSheet('modalBg'); }
function closeModal() { closeSheet('modalBg'); buildReel(); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target === document.getElementById('modalBg')) closeModal(); });

function renderCatGrid() {
  document.getElementById('catGrid').innerHTML = categories.map((c, i) => `
    <div class="cat-item">
      <button class="cat-del" onclick="delCat(event,${i})" aria-label="刪除 ${escapeHTML(c.name)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <div class="cat-label">${escapeHTML(c.name)}</div>
    </div>`).join('');
}
function delCat(e, i) {
  e.stopPropagation();
  if (categories.length <= 3) { alert('至少保留 3 個分類'); return; }
  categories.splice(i, 1); saveCategories(); renderCatGrid();
}
function addCat() {
  const name = document.getElementById('newName').value.trim();
  if (!name) { document.getElementById('newName').focus(); return; }
  categories.push({ name });
  document.getElementById('newName').value = '';
  saveCategories();
  renderCatGrid();
}
document.getElementById('newName').addEventListener('keydown', e => { if (e.key === 'Enter') addCat(); });
</script>
